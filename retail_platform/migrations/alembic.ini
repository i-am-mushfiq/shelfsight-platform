[alembic]
script_location = %(here)s
# Overridden at runtime from SHELFSIGHT_DATABASE_URL.
sqlalchemy.url = sqlite:///var/shelfsight.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
